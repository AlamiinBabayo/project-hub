<div id="cardPopup" class="popup-overlay">
  <div class="popup-card">
    <button class="popup-close" onclick="closeCardPopup()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="popup-badge">Upcoming Event</div>

    <h2 class="popup-title">Registration is Ongoing</h2>
    <p class="popup-subtitle">
      Rise Up Patriots Conference 3.0<br>
      </p>

    <div class="popup-image">
      <img src="banner.png" alt="Registration Ongoing">
    </div>

    <div class="popup-actions">
      <a href="/Register" class="btn-apply">Register Now</a>
      <button class="btn-close" onclick="closeCardPopup()">Maybe Later</button>
    </div>

    <label class="popup-dont-show">
      <input type="checkbox" id="dontShowAgain">
      Don’t show this again
    </label>
  </div>
</div>

<style>
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px 16px;           
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.2s ease;
  }

  .popup-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .popup-card {
    background: #b2fcd9;
    border-radius: 20px;
    max-width: 440px;
    width: 100%;
    padding: 28px 28px 26px;
    position: relative;
    box-shadow: 0 25px 50px -12px rgba(1, 86, 28, 0.28);
    transform: translateY(20px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
  }

  .popup-overlay.active .popup-card {
    transform: translateY(0) scale(1);
  }

  .popup-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(1, 56, 29, 0.08);
    color: #01381d;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.2s, color 0.2s, transform 0.15s;
  }

  .popup-close:hover {
    background: rgba(1, 56, 29, 0.15);
    color: #01381d;
    transform: scale(1.05);
  }

  .popup-badge {
    display: inline-block;
    background: rgba(1, 56, 29, 0.12);
    color: #01381d;
    font-size: 12px;
    font-weight: 700;
    font-style: italic;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .popup-title {
    font-size: 1.65rem;
    font-weight: 700;
    font-style: italic;
    color: #01381d;
    margin: 0 0 12px;
    line-height: 1.25;
  }

  .popup-subtitle {
    font-size: 18px;
    color: #01381d;
    font-style:italic;
    line-height: 1.55;
    margin: 0 0 22px;
  }

  .popup-image {
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 24px;
    border: 1px solid #0e5128;
  }

  .popup-image img {
    width: 100%;
    height: auto;
    display: block;
  }

  .popup-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 18px;
  }

  .btn-apply {
    display: block;
    background: #034929;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15.5px;
    padding: 15px 22px;
    border-radius: 12px;
    border: none;
    transition: background 0.22s ease, transform 0.18s ease, box-shadow 0.22s ease;
    box-shadow: 0 4px 12px rgba(3, 73, 41, 0.25);
  }

  .btn-apply:hover {
    background: #02663a;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(3, 73, 41, 0.35);
    color: #ffffff;
  }

  /* Secondary button */
  .btn-close {
    background: transparent;
    border: 1.5px solid #01381d;
    color: #01381d;
    font-weight: 550;
    font-size: 14.5px;
    padding: 13px 22px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.22s ease, color 0.22s ease, transform 0.18s ease;
  }

  .btn-close:hover {
    background: #01381d;
    color: #b2fcd9;
    transform: translateY(-1px);
  }

  .popup-dont-show {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: #01381d;
    cursor: pointer;
    user-select: none;
  }

  .popup-dont-show input {
    width: 15px;
    height: 15px;
    accent-color: #1dd89a;
    cursor: pointer;
  }

  @media (min-width: 481px) {
    .popup-overlay {
      padding: 48px 24px;       
    }
  }

  @media (max-width: 480px) {
    .popup-overlay {
      padding: 12px 10px;      
      align-items: flex-end;    
    }

    .popup-card {
      max-width: 100%;
      width: 100%;
      padding: 32px 22px 28px;
      border-radius: 22px 22px 0 0; 
      margin-bottom: 0;
    }

    .popup-title {
      font-size: 1.5rem;
    }

    .popup-subtitle {
      font-size: 14px;
    }

    .btn-apply {
      padding: 16px 20px;
      font-size: 16px;
    }
  }
</style>

<script>
  function showCardPopup() {
    if (localStorage.getItem('hideCardPopup') === 'true') return;
    const popup = document.getElementById('cardPopup');
    popup.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeCardPopup() {
    const popup = document.getElementById('cardPopup');
    const dontShow = document.getElementById('dontShowAgain');
    if (dontShow && dontShow.checked) {
      localStorage.setItem('hideCardPopup', 'true');
    }
    popup.classList.remove('active');
    document.body.style.overflow = '';
  }
  document.getElementById('cardPopup').addEventListener('click', function(e) {
    if (e.target === this) closeardPopup();
  });
  window.addEventListener('load', function() {
    setTimeout(showCardPopup, 800);
  });
</script>
